<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- A reply bubble cut by a stencil diagonal: white on one side, old-Twitter blue on the other. -->
  <defs>
    <clipPath id="tw-below"><polygon points="-10,-15 111,106 -10,106"/></clipPath>
    <clipPath id="tw-above"><polygon points="-10,-15 111,106 111,-15"/></clipPath>
    <mask id="tw-cut">
      <rect x="-10" y="-15" width="121" height="121" fill="#fff"/>
      <line x1="-10" y1="-15" x2="111" y2="106" stroke="#000" stroke-width="10"/>
    </mask>
  </defs>
  <rect width="96" height="96" rx="22" fill="#000"/>
  <g mask="url(#tw-cut)">
    <path clip-path="url(#tw-below)" fill="#fff" d="M28 16H68A16 16 0 0 1 84 32V52A16 16 0 0 1 68 68H42L20 85L28 68A16 16 0 0 1 12 52V32A16 16 0 0 1 28 16Z"/>
    <path clip-path="url(#tw-above)" fill="#1DA1F2" d="M28 16H68A16 16 0 0 1 84 32V52A16 16 0 0 1 68 68H42L20 85L28 68A16 16 0 0 1 12 52V32A16 16 0 0 1 28 16Z"/>
  </g>
</svg>
