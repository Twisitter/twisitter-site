<!doctype html>
<!-- Source of public/assets/og-image.png (1200x630): scripts/make-images.mjs renders it. -->
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; width: 1200px; height: 630px; background: #000; color: #e7e9ea;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  .card { display: flex; align-items: center; gap: 64px; height: 100%; padding: 0 88px; box-sizing: border-box; }
  .mark { width: 300px; height: 300px; flex: none; }
  .name { font-size: 92px; font-weight: 800; letter-spacing: -0.045em; line-height: 1; color: #fff; }
  .line { margin-top: 26px; font-size: 46px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.12; color: #fff; }
  .cut { background: linear-gradient(105deg, #fff 0 50%, transparent 50% 54%, #1da1f2 54%);
    -webkit-background-clip: text; background-clip: text; color: transparent; padding-right: 0.04em; }
  .url { margin-top: 30px; font-size: 26px; font-weight: 600; color: #71767b; }
</style></head><body>
  <div class="card">
    <img class="mark" src="../public/assets/mark.svg" alt="">
    <div>
      <div class="name">Twisitter</div>
      <div class="line">See when X <span class="cut">hides</span> your replies from everyone else.</div>
      <div class="url">twisitter.com</div>
    </div>
  </div>
</body></html>
